# docker compose up --build: the API on http://localhost:8080 (APP_PORT), RabbitMQ UI on :15672 (RABBITMQ_UI_PORT).
x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: payments-outbox-app
  environment: &app-env
    APP_NAME: payments-outbox
    APP_ENV: local
    APP_DEBUG: "true"
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: payments
    DB_USERNAME: payments
    DB_PASSWORD: payments
    REDIS_CLIENT: predis
    REDIS_HOST: redis
    CACHE_STORE: redis
    SESSION_DRIVER: array
    QUEUE_CONNECTION: sync
    OUTBOX_TRANSPORT: rabbitmq
    OUTBOX_RABBITMQ_HOST: rabbitmq
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  api:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
    healthcheck:
      test: ["CMD", "php", "artisan", "migrate:status", "--no-ansi"]
      interval: 5s
      timeout: 10s
      retries: 30

  web:
    image: nginx:1.27-alpine
    ports: ["${APP_PORT:-8080}:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports: ["${POSTGRES_PORT:-55440}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports: ["${REDIS_HOST_PORT:-63800}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["${RABBITMQ_UI_PORT:-15672}:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
