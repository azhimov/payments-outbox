server {
    listen 80;
    root /app/public;
    index index.php;

    # Docker's DNS, re-resolved every 10 s: a recreated api container gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream api:9000;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
        include fastcgi_params;
    }

    # php-fpm could not be reached or did not answer (api restarting, crashed, overloaded).
    # nginx answers itself, in the API's error format. The request may or may not have run,
    # so the client retries with the same Idempotency-Key. Errors from the app pass through.
    error_page 502 @api_unreachable;
    error_page 504 @api_timeout;

    location @api_unreachable {
        default_type application/json;
        add_header Retry-After 1 always;
        return 502 '{"error":{"code":"api_unreachable","message":"The API did not answer. The request may or may not have been processed: retry with the same Idempotency-Key."}}';
    }

    location @api_timeout {
        default_type application/json;
        add_header Retry-After 1 always;
        return 504 '{"error":{"code":"api_timeout","message":"The API did not answer in time. The request may or may not have been processed: retry with the same Idempotency-Key."}}';
    }
}
