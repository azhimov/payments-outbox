openapi: 3.1.0
info:
  title: payments-outbox
  version: 0.1.0
  description: |
    Demo payments API of the fictional "Demo Store". Shows azhimov/laravel-idempotency
    and azhimov/laravel-outbox together. Amounts are integers in minor units (tiyn), currency KZT.

    Any endpoint can also answer 502 api_unreachable or 504 api_timeout. Those come from the
    nginx gateway when php-fpm cannot be reached or does not answer in time (the api is
    restarting, crashed or overloaded), in the same error format. The request may or may not
    have run: retry a payment or a refund with the same Idempotency-Key.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:{port}
    description: docker compose; the port is APP_PORT
    variables:
      port: { default: '8080' }
security:
  - merchantKey: []

paths:
  /api/orders:
    post:
      summary: Create an order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrder' }
            example:
              currency: KZT
              items:
                - { sku: SKU-TEA, name: Green tea, quantity: 2, unit_price: 150000 }
      responses:
        '201': { $ref: '#/components/responses/Order' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/orders/{order}:
    get:
      summary: Show an order of the calling merchant
      operationId: getOrder
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '404': { $ref: '#/components/responses/Error' }

  /api/orders/{order}/payments:
    post:
      summary: Pay an order
      description: |
        Charges the PSP once per Idempotency-Key; a retry with the same key gets the stored
        response (`Idempotent-Replayed: true`). 201 when the outcome is final, 202 while it is
        still processing (pending at the PSP, or unknown after a timeout): poll GET /api/payments/{payment}.
      operationId: payOrder
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card_token]
              properties:
                card_token:
                  type: string
                  description: Token from the PSP card form. Demo tokens tok_success, tok_decline, tok_pending, tok_timeout, tok_error, tok_visa (random).
            example: { card_token: tok_success }
      responses:
        '201': { $ref: '#/components/responses/Payment' }
        '202': { $ref: '#/components/responses/Payment' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: idempotency_request_in_progress (with Retry-After), order_already_paid or payment_in_progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/GatewayError' }
        '504': { $ref: '#/components/responses/GatewayError' }

  /api/payments/{payment}:
    get:
      summary: Show a payment
      operationId: getPayment
      parameters: [{ $ref: '#/components/parameters/PaymentId' }]
      responses:
        '200': { $ref: '#/components/responses/Payment' }
        '404': { $ref: '#/components/responses/Error' }

  /api/payments/{payment}/refunds:
    post:
      summary: Refund a payment, partially or in full
      description: A 503 psp_unavailable is not stored; retry with the same Idempotency-Key and the PSP refunds once.
      operationId: refundPayment
      parameters:
        - { $ref: '#/components/parameters/PaymentId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, minimum: 1, description: Minor units }
            example: { amount: 100000 }
      responses:
        '201':
          description: Refund result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Refund' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/GatewayError' }
        '504': { $ref: '#/components/responses/GatewayError' }

  /api/webhooks/psp:
    post:
      summary: Final status of a pending charge, sent by the PSP
      description: Authenticated by X-Psp-Signature = sha256=HMAC-SHA256(secret, "{X-Psp-Timestamp}.{raw body}"), valid for 5 minutes; deduplicated by event id.
      operationId: pspWebhook
      security: []
      parameters:
        - { name: X-Psp-Timestamp, in: header, required: true, schema: { type: string } }
        - { name: X-Psp-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, data]
              properties:
                id: { type: string }
                type: { type: string }
                data:
                  type: object
                  required: [payment_id, status]
                  properties:
                    payment_id: { type: string }
                    psp_payment_id: { type: string }
                    status: { type: string, enum: [succeeded, declined] }
                    decline_reason: { type: string }
      responses:
        '200':
          description: processed, duplicate or ignored
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      result: { type: string, enum: [processed, duplicate, ignored] }
        '401': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    merchantKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Demo key demo-store-key (seeded).

  parameters:
    OrderId: { name: order, in: path, required: true, schema: { type: string, format: uuid } }
    PaymentId: { name: payment, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per operation (a UUID); reuse it for retries of the same operation. Scoped to the merchant.
      schema: { type: string, maxLength: 255 }

  responses:
    Order:
      description: An order
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Order' }
    Payment:
      description: A payment
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Payment' }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    GatewayError:
      description: From the nginx gateway, not the app (api_unreachable, api_timeout). The request may or may not have run; retry with the same Idempotency-Key.
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    CreateOrder:
      type: object
      required: [currency, items]
      properties:
        currency: { type: string, enum: [KZT] }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItem' }
    OrderItem:
      type: object
      required: [sku, name, quantity, unit_price]
      properties:
        sku: { type: string }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit_price: { type: integer, minimum: 1, description: Minor units }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, paid] }
        currency: { type: string }
        total_amount: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        status: { type: string, enum: [processing, succeeded, declined, failed, partially_refunded, refunded] }
        amount: { type: integer }
        currency: { type: string }
        refunded_amount: { type: integer }
        failure_reason: { type: [string, 'null'] }
    Refund:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [succeeded, failed] }
        amount: { type: integer }
        payment:
          type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string }
            refunded_amount: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [validation_failed, not_found, unauthenticated, idempotency_key_reused, idempotency_request_in_progress, order_already_paid, payment_in_progress, refund_not_allowed, invalid_payment_state, psp_unavailable, invalid_signature, api_unreachable, api_timeout] }
            message: { type: string }
            details: { type: object }
